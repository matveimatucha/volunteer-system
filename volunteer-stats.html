<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика волонтёров</title>
    <link rel="icon" type="image/png" href="assets/favicon.png?v=6">
    <link rel="shortcut icon" href="assets/favicon.png?v=6">
    <link rel="apple-touch-icon" href="assets/favicon.png?v=6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary:      #334155;
            --primary-dark: #1e293b;
            --secondary:    #64748b;
            --accent:       #2563eb;
            --success:      #1e8c5a;
            --danger:       #d63031;
            --warn:         #d97706;
        }

        body {
            font-family: 'Source Sans 3', system-ui, sans-serif;
            background: #f4f5f7;
            color: #1f2937;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }

        header h1 {
            font-family: 'Source Sans 3', system-ui, sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0;
            color: #1f2937;
        }

        .back-link {
            color: #334155;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.15s;
        }
        .back-link:hover { color: #1e293b; }

        .btn {
            display: inline-block;
            padding: 0.55rem 1.1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.88; }
        .btn-small { padding: 0.35rem 0.8rem; font-size: 0.82rem; }
        .btn-success { background: var(--success); }
        .btn-danger  { background: var(--danger); }

        .message {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-weight: 600;
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; }
        .message.error   { background: #f8d7da; color: #721c24; }

        /* Auth */
        .auth-section {
            max-width: 420px;
            margin: 4rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(51,65,85,0.1);
        }
        .auth-section h2 { margin-bottom: 1.25rem; color: var(--primary); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.88rem; opacity: 0.85; }
        .form-group input { width: 100%; padding: 0.65rem 0.9rem; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: var(--primary); }

        /* Main panel */
        .stats-panel { display: none; }
        .stats-panel.active { display: block; }

        /* Summary cards */
        .summary-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .summary-card {
            flex: 1 1 150px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 1.1rem 1.25rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(51,65,85,0.05);
        }
        .summary-card .val {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }
        .summary-card .lbl {
            font-size: 0.78rem;
            opacity: 0.65;
            margin-top: 0.35rem;
        }

        /* Event filter */
        .event-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-bottom: 1.25rem;
            align-items: center;
        }
        .event-filter-row select,
        .event-filter-row input {
            padding: 0.55rem 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            background: #fff;
        }
        .event-filter-row select:focus,
        .event-filter-row input:focus { outline: none; border-color: var(--primary); }
        .event-filter-row input[type="search"] { flex: 1; min-width: 200px; }

        /* Event stats bar */
        .event-stats-bar {
            display: none;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1.25rem;
            padding: 0.85rem 1rem;
            background: rgba(51,65,85,0.04);
            border-radius: 8px;
            border: 1px solid rgba(51,65,85,0.1);
        }
        .event-stats-bar.visible { display: flex; }
        .ev-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.87rem;
            font-weight: 600;
            padding: 0.28rem 0.75rem;
            border-radius: 20px;
            background: #fff;
            border: 1px solid #e0e0e0;
        }
        .ev-chip.present { border-color: #27ae60; color: #27ae60; }
        .ev-chip.late    { border-color: #f39c12; color: #f39c12; }
        .ev-chip.absent  { border-color: #e74c3c; color: #e74c3c; }
        .ev-chip.hours   { border-color: #2980b9; color: #2980b9; }
        .ev-chip.nomark  { border-color: #95a5a6; color: #95a5a6; }
        .ev-chip.rate    { border-color: var(--primary); color: var(--primary); }

        /* Table */
        .table-wrap { overflow-x: auto; }
        .vol-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(51,65,85,0.06);
        }
        .vol-table th {
            background: #f0f2fa;
            padding: 0.65rem 0.85rem;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 700;
            opacity: 0.8;
            white-space: nowrap;
        }
        .vol-table td {
            padding: 0.6rem 0.85rem;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        .vol-table tr:last-child td { border-bottom: none; }
        .vol-table tr.main-row:hover td { background: rgba(51,65,85,0.03); cursor: pointer; }
        .vol-table tr.detail-row { display: none; background: #fafbff; }
        .vol-table tr.detail-row.open { display: table-row; }
        .vol-table tr.detail-row td { padding: 0.5rem 1rem 0.8rem; }

        .vol-event-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.78rem;
            padding: 0.2rem 0.65rem;
            border-radius: 14px;
            margin: 0.15rem;
            border: 1px solid #ddd;
            background: #f9f9f9;
        }
        .vol-event-pill.present { border-color: #27ae60; background: #f0fff6; color: #1a7a45; }
        .vol-event-pill.late    { border-color: #f39c12; background: #fffbf0; color: #b06000; }
        .vol-event-pill.absent  { border-color: #e74c3c; background: #fff5f5; color: #a91e1e; }
        .vol-event-pill.nomark  { border-color: #bdc3c7; color: #7f8c8d; }
        .vol-comment { margin: 0.15rem 0.15rem 0.35rem; font-size: 0.86rem; line-height: 1.35; }
        .blacklist-mark { color:#a91e1e; font-weight:700; font-size:0.75rem; margin-left:0.35rem; text-transform:uppercase; letter-spacing:0.03em; }
        .blacklist-reason { color:#6b2b2b; white-space:pre-wrap; font-size:0.86rem; margin:0.35rem 0; }

        .badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
        }
        .badge-green  { background: #d4edda; color: #155724; }
        .badge-orange { background: #fff3cd; color: #856404; }
        .badge-red    { background: #f8d7da; color: #721c24; }
        .badge-grey   { background: #e9ecef; color: #495057; }

        .empty { text-align: center; padding: 3rem; opacity: 0.55; }

        @media (max-width: 600px) {
            .summary-card { flex: 1 1 130px; }
            .vol-table th, .vol-table td { padding: 0.5rem 0.55rem; font-size: 0.82rem; }
        }
    </style>
    <link rel="stylesheet" href="assets/admin-ui.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="assets/registration-utils.js?v=9"></script>
    <script src="assets/api-config.js?v=2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 Статистика волонтёров</h1>
            <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;">
                <button type="button" id="logoutBtn" class="back-link" style="display:none;border:none;cursor:pointer;font-family:inherit;" onclick="logoutUser()">Выйти</button>
                <a href="admin.html" class="back-link">← Админ-панель</a>
            </div>
        </header>

        <!-- Вход -->
        <div id="authSection" class="auth-section">
            <h2>Вход для администратора</h2>
            <div id="authMessage" class="message"></div>
            <form id="authForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="adminEmail" required placeholder="admin@example.com" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="adminPassword" required placeholder="Введите пароль" autocomplete="current-password">
                </div>
                <button type="submit" class="btn">Войти</button>
                <button type="button" class="btn" style="margin-top:0.6rem;background:#eef2f6;color:#334155;" onclick="sendAdminPasswordReset()">Не помню пароль</button>
            </form>
        </div>

        <!-- Основная панель -->
        <div id="statsPanel" class="stats-panel">
            <div id="pageMessage" class="message"></div>

            <!-- Сводные карточки -->
            <div id="summaryCards" class="summary-cards"></div>

            <!-- Фильтры -->
            <div class="event-filter-row">
                <input type="search" id="volSearch" placeholder="Поиск по имени, email, телефону…" oninput="onSearch()">
                <select id="eventFilter" onchange="onEventFilterChange()">
                    <option value="all">Все мероприятия</option>
                </select>
                <select id="dayFilter" onchange="onDayFilterChange()" style="display:none;">
                    <option value="all">Все дни</option>
                </select>
                <button type="button" class="btn btn-small" onclick="loadStats()">🔄 Обновить</button>
                <button type="button" class="btn btn-small btn-success" onclick="exportCSV()">⬇ CSV</button>
            </div>

            <!-- Статистика по выбранному мероприятию -->
            <div id="eventStatsBar" class="event-stats-bar"></div>

            <!-- Таблица -->
            <div class="table-wrap">
                <table class="vol-table" id="volTable">
                    <thead>
                        <tr>
                            <th>ФИО</th>
                            <th>Факультет</th>
                            <th>Курс</th>
                            <th>ВКонтакте</th>
                            <th style="text-align:center;">Мероп-й</th>
                            <th style="text-align:center;">Пришёл</th>
                            <th style="text-align:center;">Часов</th>
                            <th style="text-align:center;">Явка</th>
                        </tr>
                    </thead>
                    <tbody id="volTableBody">
                        <tr><td colspan="8" class="empty">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
            <p style="font-size:0.8rem;opacity:0.5;margin-top:0.75rem;">Нажмите на строку, чтобы увидеть историю по мероприятиям</p>
        </div>
    </div>

    <div id="blacklistModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:40;padding:2rem;overflow:auto;">
        <div style="background:#fff;max-width:520px;margin:2rem auto;padding:1.5rem;border-radius:16px;">
            <h2 style="margin-top:0;">Не брать</h2>
            <p id="statsBlacklistName" style="font-weight:700;"></p>
            <p id="statsBlacklistExisting" class="blacklist-reason" style="display:none;"></p>
            <label for="statsBlacklistReason">Почему не брать *</label>
            <textarea id="statsBlacklistReason" maxlength="1000" style="width:100%;min-height:90px;margin:0.4rem 0 1rem;" placeholder="Коротко, что случилось"></textarea>
            <div style="display:flex;gap:0.5rem;justify-content:flex-end;">
                <button type="button" class="btn btn-small" onclick="closeStatsBlacklist()">Отмена</button>
                <button type="button" class="btn btn-small" id="statsBlacklistSave" style="background:#a91e1e;" onclick="submitStatsBlacklist()">Подтвердить</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey:            "AIzaSyCh17f9EFqQ-fAEGXTGpuzja-vY1RpePsc",
            authDomain:        "volunteer-system-6ce7f.firebaseapp.com",
            projectId:         "volunteer-system-6ce7f",
            storageBucket:     "volunteer-system-6ce7f.firebasestorage.app",
            messagingSenderId: "273894796704",
            appId:             "1:273894796704:web:41a8f945d72bb58201c8c5"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let allVolunteers = [];
        let allEvents = [];
        let searchQuery = '';
        let selectedEventId = 'all';
        let selectedDay = 'all';

        /* ── Auth ─────────────────────────────────────── */

        async function apiFetch(path, options = {}) {
            const user = auth.currentUser;
            if (!user) throw new Error('UNAUTHORIZED');
            const token = await user.getIdToken();
            const headers = { ...(options.headers || {}), Authorization: `Bearer ${token}` };
            if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
            const res = await fetch(apiUrl(path), { ...options, headers });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const err = new Error(data.message || data.error || res.status);
                err.detail = data.message || '';
                throw err;
            }
            return data;
        }

        function showAuthMsg(type, text) {
            const el = document.getElementById('authMessage');
            el.style.display = '';
            el.className = `message ${type}`;
            el.textContent = text;
        }

        async function sendAdminPasswordReset() {
            const email = document.getElementById('adminEmail').value.trim();
            if (!email) {
                showAuthMsg('error', 'Введите email, чтобы сбросить пароль');
                return;
            }
            try {
                await auth.sendPasswordResetEmail(email);
                showAuthMsg('success', 'Письмо со ссылкой отправлено. Проверьте почту и папку «Спам».');
            } catch (error) {
                const code = error && error.code;
                if (code === 'auth/user-not-found') {
                    showAuthMsg('error', 'Пользователь с таким email не найден');
                } else if (code === 'auth/invalid-email') {
                    showAuthMsg('error', 'Некорректный email');
                } else if (code === 'auth/too-many-requests') {
                    showAuthMsg('error', 'Слишком много попыток. Подождите немного.');
                } else {
                    showAuthMsg('error', 'Не удалось отправить письмо. Попробуйте позже.');
                }
            }
        }

        function showMsg(type, text) {
            const el = document.getElementById('pageMessage');
            el.style.display = '';
            el.className = `message ${type}`;
            el.textContent = text;
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function escHtml(s) {
            return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        document.getElementById('authForm').addEventListener('submit', async e => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const pass  = document.getElementById('adminPassword').value;
            try {
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (err) {
                showAuthMsg('error', 'Неверный логин или пароль');
            }
        });

        auth.onAuthStateChanged(async user => {
            if (!user) {
                document.getElementById('authSection').style.display = '';
                document.getElementById('statsPanel').classList.remove('active');
                document.getElementById('logoutBtn').style.display = 'none';
                return;
            }
            const token = await user.getIdTokenResult();
            if (!token.claims.admin) {
                auth.signOut();
                showAuthMsg('error', 'Нет прав доступа');
                return;
            }
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('statsPanel').classList.add('active');
            document.getElementById('logoutBtn').style.display = '';
            loadStats();
        });

        function logoutUser() {
            auth.signOut();
        }

        /* ── Data loading ──────────────────────────────── */

        async function loadStats() {
            document.getElementById('volTableBody').innerHTML =
                '<tr><td colspan="8" class="empty">Загрузка...</td></tr>';
            document.getElementById('summaryCards').innerHTML = '';

            try {
                const [statsData, eventsData] = await Promise.all([
                    apiFetch('/api/admin/volunteer-stats'),
                    apiFetch('/api/admin/events')
                ]);

                allVolunteers = statsData.volunteers || [];
                allEvents = eventsData.events || [];

                // Populate event filter
                const events = allEvents
                    .filter(e => e.status !== 'draft' && !e.isTemplate)
                    .sort((a,b) => String(a.title||'').localeCompare(String(b.title||''), 'ru'));
                const sel = document.getElementById('eventFilter');
                sel.innerHTML = '<option value="all">Все мероприятия</option>'
                    + events.map(e => `<option value="${escHtml(e.id)}">${escHtml(e.title||e.id)}</option>`).join('');
                if (![...sel.options].some(o => o.value === selectedEventId)) selectedEventId = 'all';
                sel.value = selectedEventId;
                updateDayFilterOptions();

                renderSummaryCards();
                renderTable();
            } catch (err) {
                console.error(err);
                document.getElementById('volTableBody').innerHTML =
                    '<tr><td colspan="8" class="empty" style="color:var(--danger);">Не удалось загрузить данные</td></tr>';
            }
        }

        /* ── Filtering ─────────────────────────────────── */

        function onSearch() {
            searchQuery = (document.getElementById('volSearch').value || '').trim().toLowerCase();
            renderTable();
        }

        function onEventFilterChange() {
            selectedEventId = document.getElementById('eventFilter').value;
            selectedDay = 'all';
            updateDayFilterOptions();
            renderEventStatsBar();
            renderTable();
        }

        function onDayFilterChange() {
            selectedDay = document.getElementById('dayFilter').value;
            renderTable();
        }

        function updateDayFilterOptions() {
            const sel = document.getElementById('dayFilter');
            if (!sel) return;
            const event = allEvents.find(e => e.id === selectedEventId);
            const multi = event && typeof isMultiDayEvent === 'function' && isMultiDayEvent(event);
            if (!multi) {
                sel.style.display = 'none';
                sel.innerHTML = '<option value="all">Все дни</option>';
                selectedDay = 'all';
                return;
            }
            const days = enumerateEventDays(event);
            sel.style.display = '';
            sel.innerHTML = '<option value="all">Все дни</option>'
                + days.map(d => {
                    const label = typeof formatEventDayChip === 'function' ? formatEventDayChip(d) : d;
                    return `<option value="${escHtml(d)}">${escHtml(label)}</option>`;
                }).join('');
            if (![...sel.options].some(o => o.value === selectedDay)) selectedDay = 'all';
            sel.value = selectedDay;
        }

        function getFilteredVolunteers() {
            let list = allVolunteers;

            if (selectedEventId !== 'all') {
                list = list
                    .map(v => {
                        const ev = v.events.find(e => e.eventId === selectedEventId);
                        if (!ev) return null;
                        return {
                            ...v,
                            _filteredEvent: ev,
                            totalConfirmed: 1,
                            presentCount: (ev.attendance === 'present' || ev.attendance === 'late') ? 1 : 0,
                            totalHours: ev.workedHours != null ? Number(ev.workedHours) : 0,
                            events: [ev]
                        };
                    })
                    .filter(Boolean);
            }

            if (selectedEventId !== 'all' && selectedDay !== 'all') {
                list = list.filter(v => {
                    const ev = v._filteredEvent || v.events.find(e => e.eventId === selectedEventId);
                    const days = ev && Array.isArray(ev.selectedDays) ? ev.selectedDays : [];
                    if (!days.length) return true;
                    return days.includes(selectedDay);
                });
            }

            if (searchQuery) {
                list = list.filter(v =>
                    [v.name, v.email, v.phone, ...(v.events || []).map(e => e.coordinatorNote || '')].join(' ').toLowerCase().includes(searchQuery)
                );
            }

            return list;
        }

        /* ── Rendering ─────────────────────────────────── */

        function renderSummaryCards() {
            const total = allVolunteers.length;
            const everCame = allVolunteers.filter(v => v.presentCount > 0).length;
            const totalHours = allVolunteers.reduce((s, v) => s + v.totalHours, 0);
            const totalRegs = allVolunteers.reduce((s, v) => s + v.totalConfirmed, 0);

            const card = (val, lbl) => `
                <div class="summary-card">
                    <div class="val">${val}</div>
                    <div class="lbl">${lbl}</div>
                </div>`;

            document.getElementById('summaryCards').innerHTML =
                card(total, 'Волонтёров в базе') +
                card(everCame, 'Участвовали хотя бы раз') +
                card(totalHours.toFixed(0), 'Часов в сумме') +
                card(totalRegs, 'Регистраций');
        }

        function renderEventStatsBar() {
            const bar = document.getElementById('eventStatsBar');
            if (selectedEventId === 'all') {
                bar.classList.remove('visible');
                return;
            }

            const vols = allVolunteers
                .map(v => v.events.find(e => e.eventId === selectedEventId))
                .filter(Boolean);

            if (!vols.length) { bar.classList.remove('visible'); return; }

            const present = vols.filter(e => e.attendance === 'present').length;
            const late    = vols.filter(e => e.attendance === 'late').length;
            const absent  = vols.filter(e => e.attendance === 'absent').length;
            const nomark  = vols.filter(e => !e.attendance).length;
            const hours   = vols.reduce((s,e) => s + (Number(e.workedHours)||0), 0);
            const confirmed = vols.length;
            const rate = confirmed ? Math.round((present + late) / confirmed * 100) : 0;

            bar.classList.add('visible');
            bar.innerHTML = `
                <span class="ev-chip present">✓ Пришли: ${present}</span>
                <span class="ev-chip late">⏰ Опоздали: ${late}</span>
                <span class="ev-chip absent">✗ Не пришли: ${absent}</span>
                <span class="ev-chip nomark">? Без отметки: ${nomark}</span>
                <span class="ev-chip hours">⏱ Часов: ${hours.toFixed(1)}</span>
                <span class="ev-chip rate">📊 Явка: ${rate}%</span>
            `;
        }

        function attPillClass(att) {
            if (att === 'present') return 'present';
            if (att === 'late')    return 'late';
            if (att === 'absent')  return 'absent';
            return 'nomark';
        }

        function attIcon(att) {
            if (att === 'present') return '✓';
            if (att === 'late')    return '⏰';
            if (att === 'absent')  return '✗';
            return '—';
        }

        function renderTable() {
            const tbody = document.getElementById('volTableBody');
            const list = getFilteredVolunteers();

            if (!list.length) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty">Ничего не найдено</td></tr>';
                return;
            }

            const rows = list.map((v, idx) => {
                const detailId = `vd-${idx}`;
                const rate = v.totalConfirmed
                    ? Math.round(v.presentCount / v.totalConfirmed * 100) : 0;

                const rateBadge = v.totalConfirmed === 0 ? '<span class="badge badge-grey">—</span>'
                    : rate >= 80 ? `<span class="badge badge-green">${rate}%</span>`
                    : rate >= 40 ? `<span class="badge badge-orange">${rate}%</span>`
                    : `<span class="badge badge-red">${rate}%</span>`;

                const hits = Array.isArray(v.blacklist) ? v.blacklist : [];
                const hitText = hits.map(hit => hit.reason).filter(Boolean).join('\n');
                const mark = hits.length ? '<span class="blacklist-mark">не брать</span>' : '';
                const regId = ((v.events || []).find(ev => ev.registrationId) || {}).registrationId || '';
                const blockBtn = regId
                    ? `<button type="button" class="btn btn-small" style="background:#a91e1e;margin:0.35rem 0.15rem;" onclick="openStatsBlacklist('${escHtml(regId)}')">${hits.length ? 'Дописать причину' : 'Не брать'}</button>`
                    : '';
                const blockNote = hitText ? `<div class="blacklist-reason">${escHtml(hitText)}</div>` : '';
                const comments = v.events
                    .filter(ev => ev.coordinatorNote)
                    .map(ev => `<div class="vol-comment"><strong>${escHtml(ev.eventTitle || 'Мероприятие')}:</strong> ${escHtml(ev.coordinatorNote)}</div>`)
                    .join('');

                const pills = v.events.map(ev => {
                    const cls = attPillClass(ev.attendance);
                    const hrs = ev.workedHours != null ? ` · ${ev.workedHours}ч` : '';
                    const days = Array.isArray(ev.selectedDays) && ev.selectedDays.length
                        ? ` · ${typeof formatSelectedDaysDisplay === 'function' ? formatSelectedDaysDisplay(ev.selectedDays) : ev.selectedDays.join(', ')}`
                        : '';
                    return `<span class="vol-event-pill ${cls}">${attIcon(ev.attendance)} ${escHtml(ev.eventTitle || ev.eventId)}${hrs}${days}</span>`;
                }).join('');

                const vkVal = v.vk || '';
                const vkHtml = vkVal
                    ? `<a href="${vkVal.startsWith('http') ? escHtml(vkVal) : 'https://vk.com/' + escHtml(vkVal)}" target="_blank" rel="noopener" style="color:#2980b9;text-decoration:none;" onclick="event.stopPropagation()">🔗 VK</a>`
                    : '—';

                return `
                    <tr class="main-row" onclick="document.getElementById('${detailId}').classList.toggle('open')">
                        <td><strong>${escHtml(v.name || '—')}</strong>${mark}</td>
                        <td style="font-size:0.85rem;">${escHtml(v.faculty || '—')}</td>
                        <td style="font-size:0.85rem;text-align:center;">${escHtml(v.year || '—')}</td>
                        <td style="font-size:0.85rem;">${vkHtml}</td>
                        <td style="text-align:center;">${v.totalConfirmed}</td>
                        <td style="text-align:center;color:#27ae60;font-weight:700;">${v.presentCount}</td>
                        <td style="text-align:center;font-weight:700;">${v.totalHours > 0 ? v.totalHours.toFixed(1) : '—'}</td>
                        <td style="text-align:center;">${rateBadge}</td>
                    </tr>
                    <tr id="${detailId}" class="detail-row">
                        <td colspan="8">
                            <div style="padding:0.2rem 0;">
                                ${blockNote}
                                ${blockBtn}
                                ${comments}
                                ${pills || '<span style="opacity:0.55;">Нет данных о мероприятиях</span>'}
                            </div>
                        </td>
                    </tr>`;
            }).join('');

            tbody.innerHTML = rows;
        }

        let statsBlacklistId = '';

        function openStatsBlacklist(registrationId) {
            const person = allVolunteers.find(item => (item.events || []).some(ev => ev.registrationId === registrationId));
            if (!person) return;
            statsBlacklistId = registrationId;
            document.getElementById('statsBlacklistName').textContent = person.name || '—';
            const existing = document.getElementById('statsBlacklistExisting');
            const text = (person.blacklist || []).map(hit => hit.reason).filter(Boolean).join('\n');
            existing.style.display = text ? '' : 'none';
            existing.textContent = text ? `Уже в списке:\n${text}\nНовая причина добавится к этой.` : '';
            document.getElementById('statsBlacklistReason').value = '';
            document.getElementById('blacklistModal').style.display = 'block';
        }

        function closeStatsBlacklist() {
            statsBlacklistId = '';
            document.getElementById('blacklistModal').style.display = 'none';
        }

        async function submitStatsBlacklist() {
            const reason = (document.getElementById('statsBlacklistReason').value || '').trim();
            if (!statsBlacklistId) return;
            if (!reason) {
                alert('Напишите, почему человека не брать');
                return;
            }
            const button = document.getElementById('statsBlacklistSave');
            if (button) button.disabled = true;
            try {
                await apiFetch('/api/admin/blacklist', {
                    method: 'POST',
                    body: JSON.stringify({ registrationId: statsBlacklistId, reason })
                });
                closeStatsBlacklist();
                await loadStats();
            } catch (err) {
                alert(err.detail || err.message || 'Не удалось сохранить пометку');
            } finally {
                if (button) button.disabled = false;
            }
        }

        /* ── CSV export ────────────────────────────────── */

        function escapeCsv(v) {
            const s = String(v ?? '');
            return s.includes(',') || s.includes('"') || s.includes('\n')
                ? '"' + s.replace(/"/g, '""') + '"' : s;
        }

        function exportCSV() {
            const list = getFilteredVolunteers();
            if (!list.length) { alert('Нет данных для экспорта'); return; }

            const header = ['ФИО', 'Факультет', 'Курс', 'ВКонтакте', 'Email', 'Телефон', 'Мероприятий', 'Пришёл', 'Часов', 'Явка %', 'Комментарии'].map(escapeCsv).join(',');
            const rows = list.map(v => {
                const rate = v.totalConfirmed ? Math.round(v.presentCount / v.totalConfirmed * 100) : 0;
                return [
                    v.name || '',
                    v.faculty || '',
                    v.year || '',
                    v.vk || '',
                    v.email || '',
                    v.phone || '',
                    v.totalConfirmed,
                    v.presentCount,
                    v.totalHours.toFixed(1),
                    v.totalConfirmed ? rate + '%' : '',
                    (v.events || [])
                        .filter(ev => ev.coordinatorNote)
                        .map(ev => `${ev.eventTitle || 'Мероприятие'}: ${ev.coordinatorNote}`)
                        .join(' | ')
                ].map(escapeCsv).join(',');
            });

            const csv = '\uFEFF' + [header, ...rows].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `volunteer_stats_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
