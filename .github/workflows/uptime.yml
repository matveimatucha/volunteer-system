name: Site uptime check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check /health
        run: |
          body=$(curl -fsS --max-time 30 https://volunteer.msuprof.com/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'

      - name: Check main page
        run: |
          code=$(curl -fsS --max-time 30 -o /dev/null -w "%{http_code}" https://volunteer.msuprof.com/)
          echo "HTTP $code"
          test "$code" = "200"

      - name: Check registration page
        run: |
          code=$(curl -fsS --max-time 30 -o /dev/null -w "%{http_code}" https://volunteer.msuprof.com/register.html)
          echo "HTTP $code"
          test "$code" = "200"
