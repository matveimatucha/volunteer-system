<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал волонтёров — Профком МГУ</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="shortcut icon" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@300;400;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="assets/opk-theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary:       #1B2480;
            --primary-dark:  #121963;
            --secondary:     #4472C4;
            --accent:        #E8C225;
            --dark:          #1a2060;
            --light:         #F7F3C4;
            --success:       #1e8c5a;
            --danger:        #d63031;
            --text:          #3a3f6b;
        }

        body {
            font-family: 'Source Sans 3', sans-serif;
            background-color: #F7F3C4;
            min-height: 100vh;
            color: var(--text);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 40% 40% at 5%  5%,  rgba(68,114,196,.08) 0%, transparent 100%),
                radial-gradient(ellipse 40% 40% at 95% 5%,  rgba(232,194,37,.11) 0%, transparent 100%),
                radial-gradient(ellipse 40% 40% at 95% 95%, rgba(232,194,37,.09) 0%, transparent 100%),
                radial-gradient(ellipse 40% 40% at 5%  95%, rgba(68,114,196,.08) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 4rem auto;
            aspect-ratio: 4 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: linear-gradient(150deg, #1B2480 0%, #1f2ca0 50%, #1B2480 100%), url('assets/main-bg.jpg') no-repeat center center / cover;
            border-radius: 20px;
            box-shadow: 0 12px 48px rgba(27,36,128,.25);
            animation: fadeInDown 0.8s ease-out;
            box-sizing: border-box;
        }

        .logo-wrapper {
            margin-bottom: 1rem;
        }

        .main-logo {
            max-height: 80px;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 5rem;
            color: white;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            line-height: 1;
        }

        .tagline {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            letter-spacing: 1px;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
            align-items: stretch;
        }

        .event-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 36px rgba(26, 26, 46, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.75);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
            cursor: pointer;
            --card-accent: var(--primary);
        }

        .event-card:nth-child(1) { animation-delay: 0.1s; }
        .event-card:nth-child(2) { animation-delay: 0.2s; }
        .event-card:nth-child(3) { animation-delay: 0.3s; }
        .event-card:nth-child(4) { animation-delay: 0.4s; }
        .event-card:nth-child(5) { animation-delay: 0.5s; }
        .event-card:nth-child(6) { animation-delay: 0.6s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .event-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(26, 26, 46, 0.18);
        }

        .event-header {
            padding: 0;
            color: white;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            aspect-ratio: 16 / 9;
            min-height: 200px;
        }

        .event-header-scrim {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(
                180deg,
                rgba(15, 18, 28, 0.35) 0%,
                rgba(15, 18, 28, 0.72) 55%,
                rgba(15, 18, 28, 0.94) 100%
            );
        }

        .event-header.has-cover .event-header-scrim {
            background: linear-gradient(
                180deg,
                rgba(15, 18, 28, 0.55) 0%,
                rgba(15, 18, 28, 0.78) 45%,
                rgba(15, 18, 28, 0.96) 100%
            );
        }

        .event-header-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 4;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            padding: 1rem 1rem 0;
        }

        .event-date-badge {
            display: inline-block;
            background: #fff;
            color: var(--dark);
            padding: 0.45rem 0.8rem;
            border-radius: 10px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1.2;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .event-cover-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        .event-card-logo-wrap {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
        }

        .event-card-logo-wrap.is-empty {
            display: none;
        }

        .event-card-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .event-header-content {
            position: relative;
            z-index: 3;
            margin-top: auto;
            padding: 0 1.35rem 1.35rem;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
        }

        /* Разноцветные плашки для мероприятий */
        .event-header.color-1 {
            background: linear-gradient(135deg, #ff6b35 0%, #e85a28 100%);
        }
        .event-header.color-2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .event-header.color-3 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .event-header.color-4 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .event-header.color-5 {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        .event-header.color-6 {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
        .event-header.color-7 {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
        }
        .event-header.color-8 {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .event-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.85rem;
            margin-bottom: 0.35rem;
            letter-spacing: 0.5px;
            line-height: 1.05;
        }

        .event-location {
            font-size: 0.9rem;
            opacity: 0.92;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .event-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.35rem 1.35rem 1.5rem;
            border-top: 4px solid var(--card-accent);
            min-height: 200px;
        }

        .event-body-main {
            flex: 1;
            min-height: 4.75rem;
            margin-bottom: 1rem;
        }

        .event-description {
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 0;
            font-size: 0.95rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .event-body-actions {
            flex-shrink: 0;
            margin-top: auto;
        }

        .spots-block {
            margin-bottom: 1rem;
        }

        .spots-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 0.45rem;
        }

        .spots-count {
            font-weight: 700;
            font-size: 1rem;
            color: var(--card-accent);
        }

        .spots-meter {
            height: 8px;
            background: #e9edf3;
            border-radius: 999px;
            overflow: hidden;
        }

        .spots-meter-fill {
            height: 100%;
            border-radius: 999px;
            background: var(--card-accent);
            transition: width 0.4s ease;
        }

        .event-footer {
            padding-top: 0.15rem;
            display: flex;
            gap: 0.5rem;
            align-items: stretch;
        }

        .register-btn {
            flex: 1;
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, #1B2480 0%, #2639B0 100%);
            box-shadow: 0 8px 22px rgba(27, 36, 128, 0.30);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .register-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(27, 36, 128, 0.42);
        }

        .register-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .register-btn:disabled {
            cursor: not-allowed;
            background: #c4c8d8;
            box-shadow: none;
            color: rgba(255, 255, 255, 0.95);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(27, 36, 128, 0.05);
            border: 1px solid rgba(27, 36, 128, 0.12);
            border-radius: 20px;
            color: #1B2480;
        }

        .empty-state h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        .empty-state p {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #1B2480;
            font-size: 1.2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(27, 36, 128, 0.15);
            border-top-color: #1B2480;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .archive-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin: 1.5rem 0 1rem;
        }

        .archive-btn {
            background: transparent;
            border: none;
            color: rgba(27, 36, 128, 0.55);
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .archive-btn:hover {
            color: #1B2480;
            background: rgba(27, 36, 128, 0.05);
            text-decoration: none;
        }

        .archive-label {
            color: rgba(27, 36, 128, 0.45);
            font-size: 0.82rem;
        }

        .archive-section {
            margin-top: 1rem;
        }

        .archive-hint {
            text-align: center;
            color: rgba(27, 36, 128, 0.62);
            font-size: 0.92rem;
            margin: 0 0 1.25rem;
            line-height: 1.45;
        }

        .archive-section .events-grid {
            opacity: 0.65;
        }

        .event-card.past {
            filter: grayscale(30%);
        }

        .event-card.past.has-recap {
            cursor: pointer;
        }

        .event-card.past.has-recap:hover {
            filter: grayscale(10%);
        }

        .recap-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .recap-modal.is-open {
            opacity: 1;
            visibility: visible;
        }

        .recap-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(15, 18, 28, 0.72);
            backdrop-filter: blur(4px);
        }

        .recap-dialog {
            position: relative;
            z-index: 1;
            width: min(520px, 100%);
            max-height: min(90vh, 720px);
            overflow-y: auto;
            background: #fff;
            border-radius: 20px;
            padding: 1.5rem 1.5rem 1.75rem;
            box-shadow: 0 24px 64px rgba(26, 26, 46, 0.28);
            transform: translateY(12px) scale(0.98);
            transition: transform 0.25s ease;
        }

        .recap-modal.is-open .recap-dialog {
            transform: translateY(0) scale(1);
        }

        .recap-close {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: rgba(27, 36, 128, 0.08);
            color: #1B2480;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .recap-close:hover {
            background: rgba(27, 36, 128, 0.15);
        }

        .recap-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.65rem;
            color: #1B2480;
            letter-spacing: 0.5px;
            margin: 0 2rem 1rem 0;
            line-height: 1.1;
        }

        .recap-photo-wrap {
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 1rem;
            background: #f0f2f8;
        }

        .recap-photo-wrap img {
            display: block;
            width: 100%;
            max-height: 360px;
            object-fit: cover;
        }

        .recap-text {
            margin: 0;
            color: #333;
            font-size: 0.98rem;
            line-height: 1.65;
            white-space: pre-wrap;
        }

        /* ===== ПЛАНШЕТ ===== */
        @media (max-width: 768px) {
            .container {
                padding: 1.25rem;
            }
            header {
                aspect-ratio: auto;
                padding: 2.5rem 1.5rem;
                margin-bottom: 2.5rem;
            }
            h1 {
                font-size: 3rem;
            }
            .events-grid {
                grid-template-columns: 1fr;
                gap: 1.25rem;
            }
            .search-controls {
                gap: 0.6rem 1rem;
            }
        }

        /* ===== ТЕЛЕФОН ===== */
        @media (max-width: 480px) {
            .container {
                padding: 0.85rem;
            }
            header {
                padding: 2rem 1.1rem 1.6rem;
                margin-bottom: 1.75rem;
                border-radius: 14px;
            }
            .logo-wrapper { margin-bottom: 0.6rem; }
            .main-logo { max-height: 56px; }
            h1 {
                font-size: 2.4rem;
                letter-spacing: 1px;
                margin-bottom: 0.5rem;
            }
            .tagline { font-size: 0.95rem; }
            .events-grid {
                gap: 1rem;
            }
            .event-header {
                min-height: 150px;
            }
            .event-title {
                font-size: 1.55rem;
            }
            .event-body {
                padding: 1rem 1rem 1.1rem;
            }
            .event-footer {
                gap: 0.4rem;
            }
            .register-btn {
                height: 46px;
            }
            .search-controls {
                margin-bottom: 1.5rem;
                gap: 0.5rem;
            }
            .search-box {
                flex-basis: 100%;
                min-width: 0;
            }
            .archive-toggle {
                flex-direction: column;
                gap: 0.6rem;
                align-items: center;
            }
            .archive-section .events-grid {
                opacity: 0.7;
            }
        }

        /* ===== МАЛЕНЬКИЙ ТЕЛЕФОН ===== */
        @media (max-width: 360px) {
            .container { padding: 0.65rem; }
            h1 { font-size: 2rem; }
            .event-title { font-size: 1.35rem; }
            .event-body { padding: 0.85rem 0.85rem 1rem; }
            .register-btn { font-size: 0.8rem; letter-spacing: 0.04em; }
        }

        .search-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem 1.25rem;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            max-width: 720px;
        }
        .search-box {
            position: relative;
            flex: 1 1 320px;
            min-width: 240px;
        }
        .search-box .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.6;
            pointer-events: none;
        }
        #eventSearch {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.6rem;
            border: 1.5px solid rgba(27, 36, 128, 0.22);
            border-radius: 14px;
            font-size: 1rem;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 6px 20px rgba(27, 36, 128, 0.09);
            outline: none;
            color: #1a2060;
        }
        #eventSearch:focus {
            border-color: #1B2480;
            box-shadow: 0 8px 28px rgba(27, 36, 128, 0.20);
        }
        .free-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            color: #1B2480;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .free-toggle input { width: 18px; height: 18px; cursor: pointer; accent-color: #1B2480; }

    </style>
</head>

          <line x1="35" y1="102" x2="35" y2="109" stroke="#B898DC" stroke-width="2"/>
          <circle cx="35" cy="111" r="2.5" fill="#B898DC"/>
          <!-- колокольчик 3 – правая ветка -->
          <path d="M100,105 Q86,105 83,120 Q92,127 100,128 Q108,127 117,120 Q114,105 100,105Z" fill="#7B5CCA"/>
          <ellipse cx="100" cy="128" rx="9.5" ry="4" fill="#9070D8" opacity=".7"/>

          <circle cx="100" cy="141" r="2.5" fill="#C4A8E8"/>

            <p class="recap-text" id="recapText" hidden></p>

    <script src="assets/api-config.js"></script>

    <script>



        function handleEventLogoError(img) {
            if (!img.dataset.fallback) {
                img.dataset.fallback = '1';
                img.src = 'assets/logo.png';
                return;
            }
            const wrap = img.closest('.event-card-logo-wrap');
            if (wrap) {
                wrap.innerHTML = '<span style="font-family:\'Bebas Neue\',sans-serif;font-size:0.85rem;color:#1B2480;letter-spacing:0.5px;user-select:none;">ОПК</span>';
            }
        }

        function hexToRgba(hex, alpha) {
            const num = parseInt(hex.replace('#', ''), 16);
            const r = (num >> 16);
            const g = (num >> 8) & 0x00FF;
            const b = num & 0x0000FF;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function createEventCard(event, options = {}) {
            const card = document.createElement('div');
            card.className = 'event-card';
            const isPast = !!options.isPast;
            
            const maxVolunteers = Number(event.maxVolunteers) || 0;
            const currentVolunteers = Number(event.currentVolunteers) || 0;
            const isUnlimited = !maxVolunteers;
            const spotsLeft = isUnlimited ? 999999 : Math.max(maxVolunteers - currentVolunteers, 0);
            const isClosed = (event.status || 'open') === 'closed' || event.isArchived === true;
            const isWaitlistOnly = !isUnlimited && spotsLeft <= 0;
            const canRegister = !isClosed && (isUnlimited || spotsLeft > 0 || isWaitlistOnly);
            
            const eventColor = event.color || '#ff6b35';
            card.style.setProperty('--card-accent', eventColor);

            const imageUrl = getDirectImageUrl(event.image);
            const logoUrl = typeof getEventLogoUrl === 'function'
                ? getEventLogoUrl(event.logo)
                : (getDirectImageUrl(event.logo) || 'assets/logo.png');
            const eventId = event.id || '';
            const displayDate = typeof formatEventDisplayDate === 'function'
                ? formatEventDisplayDate(event.date || event.dateRaw || '')
                : (event.date || event.dateRaw || '');
            const hasCover = !!imageUrl;
            const headerBg = hasCover
                ? 'background: #1a1f2e;'
                : `background: linear-gradient(155deg, ${hexToRgba(adjustColor(eventColor, -35), 1)} 0%, ${hexToRgba(eventColor, 1)} 55%, ${hexToRgba(adjustColor(eventColor, -15), 1)} 100%);`;
            const coverImg = imageUrl
                ? `<img class="event-cover-image" src="${escapeHtmlAttr(imageUrl)}" alt="" referrerpolicy="no-referrer" onerror="this.remove(); this.closest('.event-header')?.classList.remove('has-cover')">`
                : '';
            const headerClass = `event-header${hasCover ? ' has-cover' : ''}`;
            const spotsPercent = isUnlimited
                ? 0
                : (spotsLeft > 0 ? Math.max(6, Math.round((spotsLeft / maxVolunteers) * 100)) : 0);
            const btnLabel = isClosed
                ? 'Регистрация закрыта'
                : (isWaitlistOnly ? '📋 Лист ожидания' : (spotsLeft > 0 ? 'Записаться' : 'Мест нет'));
            const btnExtraStyle = (!isClosed && isWaitlistOnly)
                ? 'background:linear-gradient(135deg,#e67e22 0%,#d35400 100%)!important;box-shadow:0 8px 22px rgba(230,126,34,.35)!important;'
                : '';

            const archivePhotoUrl = getDirectImageUrl(event.archivePhoto);
            const archiveText = String(event.archiveText || '').trim();
            const hasRecap = isPast && (archivePhotoUrl || archiveText);

            if (hasRecap) {
                card.classList.add('has-recap');
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('title', 'Итоги мероприятия');
                window._eventRecapData = window._eventRecapData || {};
                window._eventRecapData[eventId] = {
                    title: event.title || '',
                    photo: archivePhotoUrl,
                    text: archiveText
                };
            }
            
            card.innerHTML = `
                <div class="${headerClass}" style="${headerBg}">
                    ${coverImg}
                    <div class="event-header-scrim"></div>
                    <div class="event-header-top">
                        <span class="event-date-badge">${escapeHtmlText(displayDate)}</span>
                        <div class="event-card-logo-wrap">
                            <img src="${escapeHtmlAttr(logoUrl)}" alt="Логотип" class="event-card-logo" referrerpolicy="no-referrer" onerror="handleEventLogoError(this)">
                        </div>
                    </div>
                    <div class="event-header-content">
                        <div class="event-title">${escapeHtmlText(event.title)}</div>
                        <div class="event-location"><span aria-hidden="true">📍</span> ${escapeHtmlText(event.location)}</div>
                    </div>
                </div>
                <div class="event-body">
                    <div class="event-body-main">
                        <div class="event-description">${escapeHtmlText(event.description || ' ')}</div>
                    </div>
                    <div class="event-body-actions">
                        <div class="spots-block">
                            <div class="spots-row">
                                ${isUnlimited ? `
                                    <span>Уже записалось</span>
                                    <span class="spots-count">${currentVolunteers}</span>
                                ` : `
                                    <span>Свободно мест</span>
                                    <span><span class="spots-count">${spotsLeft}</span> из ${maxVolunteers}</span>
                                `}
                            </div>
                            ${isUnlimited ? '' : `
                                <div class="spots-meter" role="presentation">
                                    <div class="spots-meter-fill" style="width: ${spotsPercent}%;"></div>
                                </div>
                            `}
                        </div>
                        <div class="event-footer">
                            <button type="button" class="register-btn" onclick="goToRegistration('${escapeHtmlAttr(eventId)}')" ${!canRegister ? 'disabled' : ''} style="${btnExtraStyle}">${btnLabel}</button>
                        </div>
                    </div>
                </div>
            `;
            
            if (hasRecap) {
                const openRecap = (e) => {
                    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
                    if (e.type === 'keydown') e.preventDefault();
                    showEventRecap(eventId);
                };
                card.addEventListener('click', openRecap);
                card.addEventListener('keydown', openRecap);
            }

            return card;
        }

        function showEventRecap(eventId) {
            const data = window._eventRecapData?.[eventId];
            if (!data) return;

            const modal = document.getElementById('recapModal');
            const titleEl = document.getElementById('recapTitle');
            const photoWrap = document.getElementById('recapPhotoWrap');
            const textEl = document.getElementById('recapText');

            titleEl.textContent = data.title || 'Итоги мероприятия';

            if (data.photo) {
                photoWrap.hidden = false;
                photoWrap.innerHTML = `<img src="${escapeHtmlAttr(data.photo)}" alt="" referrerpolicy="no-referrer">`;
            } else {
                photoWrap.hidden = true;
                photoWrap.innerHTML = '';
            }

            if (data.text) {
                textEl.hidden = false;
                textEl.textContent = data.text;
            } else {
                textEl.hidden = true;
                textEl.textContent = '';
            }

            modal.classList.add('is-open');
            modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeEventRecap() {
            const modal = document.getElementById('recapModal');
            modal.classList.remove('is-open');
            modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeEventRecap();
        });

        // Функция для затемнения/осветления цвета
        function adjustColor(color, amount) {
            const clamp = (num) => Math.min(Math.max(num, 0), 255);
            const num = parseInt(color.replace('#', ''), 16);
            const r = clamp((num >> 16) + amount);
            const g = clamp(((num >> 8) & 0x00FF) + amount);
            const b = clamp((num & 0x0000FF) + amount);
            return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }

        function goToRegistration(eventId) {
            window.location.href = `register.html?event=${eventId}`;
        }

        const CACHE_KEY = 'volunteer_events_v2';
        const CACHE_DURATION = 5 * 60 * 1000; // 5 минут

        function getCachedEvents() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                const { events, ts } = JSON.parse(raw);
                if (Date.now() - ts > CACHE_DURATION) return null;
                return events;
            } catch {
                return null;
            }
        }

        function setCachedEvents(events) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ events, ts: Date.now() }));
            } catch {}
        }

        async function loadEventsWithCache() {
            // Показываем кэш мгновенно, если он свежий
            const cached = getCachedEvents();
            if (cached) {
                displayEvents(cached);
                // Тихо обновляем в фоне
                loadEvents(true);
                return;
            }
            // Кэша нет — грузим с лоадером
            await loadEvents(false);
        }

        function getEventFilterState() {
            const search = document.getElementById('eventSearch');
            const freeOnly = document.getElementById('freeOnly');
            return {
                query: (search?.value || '').trim().toLowerCase(),
                freeOnly: !!freeOnly?.checked
            };
        }

        function matchesEventFilter(event, state) {
            if (state.query) {
                const haystack = [event.title, event.location, event.description]
                    .map(v => String(v || '').toLowerCase())
                    .join(' ');
                if (!haystack.includes(state.query)) return false;
            }
            if (state.freeOnly) {
                const max = Number(event.maxVolunteers) || 0;
                const current = Number(event.currentVolunteers) || 0;
                const isClosed = (event.status || 'open') === 'closed' || event.isArchived === true;
                const hasRoom = !max || current < max;
                if (isClosed || !hasRoom) return false;
            }
            return true;
        }

        function applyEventFilters() {
            if (window._allEvents) displayEvents(window._allEvents);
        }

        function displayEvents(events) {
            const container = document.getElementById('eventsContainer');
            window._allEvents = events;

            if (!events || events.length === 0) {
                document.getElementById('searchControls').style.display = 'none';
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>Пока нет мероприятий</h2>
                        <p>Скоро здесь появятся интересные события!</p>
                    </div>
                `;
                return;
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Черновики и шаблоны скрыты; архив — вручную или по дате (см. isEventArchived)
            const visible = events.filter(e => {
                const status = e.status || 'open';
                return status !== 'draft' && e.isTemplate !== true;
            });

            document.getElementById('searchControls').style.display = visible.length > 0 ? 'flex' : 'none';

            const filterState = getEventFilterState();
            const hasFilter = filterState.query || filterState.freeOnly;
            const activeAll  = visible.filter(e => !isEventArchived(e, today));
            const past       = visible.filter(e => isEventArchived(e, today))
                .filter(e => matchesEventFilter(e, filterState));
            const active     = activeAll.filter(e => matchesEventFilter(e, filterState));

            let html = '';

            if (hasFilter && active.length === 0 && past.length === 0) {
                html += `<div class="empty-state">
                    <h2>Ничего не найдено</h2>
                    <p>Попробуйте изменить запрос или сбросить фильтры.</p>
                </div>`;
                container.innerHTML = html;
                return;
            }

            if (active.length > 0) {
                html += '<div class="events-grid">' +
                    active.map(() => '').join('') +
                '</div>';
            } else if (visible.length > 0) {
                html += `<div class="empty-state">
                    <h2>Актуальных мероприятий нет</h2>
                    <p>Все события перенесены в архив — откройте его ниже.</p>
                </div>`;
            } else {
                html += `<div class="empty-state">
                    <h2>Пока нет мероприятий</h2>
                    <p>Скоро здесь появятся интересные события!</p>
                </div>`;
            }

            if (past.length > 0) {
                const pastHasRecap = past.some(e => {
                    const photo = getDirectImageUrl(e.archivePhoto);
                    const text = String(e.archiveText || '').trim();
                    return photo || text;
                });
                const archiveHint = pastHasRecap
                    ? '<p class="archive-hint">Нажми на мероприятие, чтобы узнать подробнее</p>'
                    : '';
                html += `<div class="archive-toggle">
                    <span class="archive-label">Прошедших мероприятий: ${past.length}</span>
                    <button class="archive-btn" onclick="toggleArchive()">Показать архив</button>
                </div>
                <div id="archiveSection" class="archive-section" style="display:none;">
                    ${archiveHint}
                    <div class="events-grid" id="archiveGrid"></div>
                </div>`;
            }

            container.innerHTML = html;

            // Рендерим активные карточки
            if (active.length > 0) {
                const grid = container.querySelector('.events-grid');
                active.forEach(event => {
                    try {
                        grid.appendChild(createEventCard(event));
                    } catch (err) {
                        console.error('Не удалось отрисовать карточку:', event?.id, err);
                    }
                });
            }

            container._pastEvents = past;
            window._eventRecapData = {};

            // Если актуальных нет, но архив есть — раскрываем его сразу
            if (active.length === 0 && past.length > 0) {
                renderArchiveCards(container);
                const section = document.getElementById('archiveSection');
                const btn = document.querySelector('.archive-btn');
                if (section) section.style.display = 'block';
                if (btn) btn.textContent = 'Скрыть архив';
            }
        }

        function renderArchiveCards(container) {
            const grid = document.getElementById('archiveGrid');
            if (!grid || !container._pastEvents?.length) return;
            grid.innerHTML = '';
            container._pastEvents.forEach(event => {
                try {
                    const card = createEventCard(event, { isPast: true });
                    card.classList.add('past');
                    grid.appendChild(card);
                } catch (err) {
                    console.error('Не удалось отрисовать архивную карточку:', event?.id, err);
                }
            });
        }

        function toggleArchive() {
            const section = document.getElementById('archiveSection');
            const btn = document.querySelector('.archive-btn');
            const container = document.getElementById('eventsContainer');

            if (section.style.display === 'none') {
                section.style.display = 'block';
                btn.textContent = 'Скрыть архив';

                if (!document.getElementById('archiveGrid')?.hasChildNodes()) {
                    renderArchiveCards(container);
                }
            } else {
                section.style.display = 'none';
                btn.textContent = 'Показать архив';
            }
        }

        async function loadEvents(silent = false) {
            try {
                const res = await fetch(apiUrl('/api/events'));
                if (!res.ok) throw new Error('API_' + res.status);
                const data = await res.json();
                const events = (data.events || []).map(e => ({
                    ...e,
                    id: e.id || e.eventId
                }));
                setCachedEvents(events);
                displayEvents(events);
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                if (!silent) {
                    document.getElementById('eventsContainer').innerHTML = `
                        <div class="empty-state">
                            <h2>Ошибка загрузки</h2>
                            <p>Не удалось загрузить мероприятия. Попробуйте обновить страницу.</p>
                        </div>
                    `;
                }
            }
        }

        // Поиск и фильтры
        document.getElementById('eventSearch')?.addEventListener('input', applyEventFilters);
        document.getElementById('freeOnly')?.addEventListener('change', applyEventFilters);

        // Загружаем мероприятия при загрузке страницы
        loadEventsWithCache();
    </script>
</body>
</html>
