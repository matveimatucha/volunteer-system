<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отмена записи</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="shortcut icon" href="assets/favicon.svg">
    <style>
        :root {
            --primary: #1B2480;
            --danger:  #d63031;
            --text:    #1a2060;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F7F3C4;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(27, 36, 128, 0.16);
            padding: 2.5rem 2rem;
            max-width: 460px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 1.4rem; margin: 0 0 1rem; }
        p { line-height: 1.55; opacity: 0.9; }
        .event-name { font-weight: 700; color: var(--primary); }
        .btn {
            display: inline-block;
            border: none;
            border-radius: 12px;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin: 0.4rem;
            font-family: inherit;
        }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-ghost { background: transparent; color: #1B2480; border: 2px solid rgba(27,36,128,.35); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .spinner {
            width: 36px; height: 36px;
            border: 4px solid #e3def9;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
        .ok { color: #1f9d55; }
        .err { color: var(--danger); }
        @media (max-width: 480px) {
            body { padding: 1rem; align-items: flex-start; padding-top: 2.5rem; }
            .card { padding: 2rem 1.25rem; border-radius: 14px; }
            .btn { display: block; width: 100%; margin: 0.35rem 0; }
        }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="spinner"></div>
        <p>Загрузка заявки...</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script src="assets/registration-utils.js"></script>
    <script src="assets/sheets-sync.js"></script>
    <script>
        const firebaseConfig = {
            apiKey:            "AIzaSyCh17f9EFqQ-fAEGXTGpuzja-vY1RpePsc",
            authDomain:        "volunteer-system-6ce7f.firebaseapp.com",
            projectId:         "volunteer-system-6ce7f",
            storageBucket:     "volunteer-system-6ce7f.firebasestorage.app",
            messagingSenderId: "273894796704",
            appId:             "1:273894796704:web:41a8f945d72bb58201c8c5"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const params = new URLSearchParams(window.location.search);
        const registrationId = params.get('reg');
        const eventId = params.get('event');
        const card = document.getElementById('card');

        function render(html) { card.innerHTML = html; }

        function backHome() {
            return '<a href="index.html" class="btn btn-ghost">На главную</a>';
        }

        async function init() {
            if (!registrationId || !eventId) {
                render(`<h1>Ссылка недействительна</h1><p>Не удалось определить заявку.</p>${backHome()}`);
                return;
            }

            try {
                const regSnap = await db.collection('registrations').doc(registrationId).get();
                if (!regSnap.exists) {
                    render(`<h1>Заявка не найдена</h1><p>Возможно, она уже была удалена.</p>${backHome()}`);
                    return;
                }

                const reg = regSnap.data();
                if (reg.status === 'cancelled') {
                    render(`<h1 class="ok">Запись уже отменена</h1><p>Эта заявка больше не активна.</p>${backHome()}`);
                    return;
                }

                let eventTitle = reg.eventTitle || '';
                try {
                    const evSnap = await db.collection('events').doc(eventId).get();
                    if (evSnap.exists) eventTitle = evSnap.data().title || eventTitle;
                } catch {}

                render(`
                    <h1>Отменить запись?</h1>
                    <p>Вы записаны на мероприятие:</p>
                    <p class="event-name">${escapeHtmlText(eventTitle || 'Мероприятие')}</p>
                    <p>Если вы передумали участвовать, отмените запись — это освободит место для других.</p>
                    <div id="actions">
                        <button class="btn btn-danger" onclick="doCancel()">Да, отменить запись</button>
                        <a href="index.html" class="btn btn-ghost">Я остаюсь</a>
                    </div>
                    <div id="msg"></div>
                `);
            } catch (err) {
                console.error(err);
                render(`<h1 class="err">Ошибка</h1><p>Не удалось загрузить заявку. Попробуйте позже.</p>${backHome()}`);
            }
        }

        async function doCancel() {
            const actions = document.getElementById('actions');
            const msg = document.getElementById('msg');
            if (actions) actions.querySelectorAll('button, a').forEach(el => el.setAttribute('disabled', 'true'));
            if (msg) msg.innerHTML = '<div class="spinner"></div>';

            const eventRef = db.collection('events').doc(eventId);
            const regRef = db.collection('registrations').doc(registrationId);

            try {
                await db.runTransaction(async (transaction) => {
                    // Firestore требует выполнить все чтения до записей.
                    const regSnap = await transaction.get(regRef);
                    if (!regSnap.exists) throw new Error('NOT_FOUND');
                    const reg = regSnap.data();
                    if (reg.status === 'cancelled') return;

                    const wasConfirmed = isConfirmedRegistration(reg);
                    const evSnap = wasConfirmed ? await transaction.get(eventRef) : null;

                    transaction.update(regRef, {
                        status: 'cancelled',
                        cancelledAt: new Date().toISOString()
                    });

                    if (wasConfirmed && evSnap && evSnap.exists) {
                        const current = Number(evSnap.data().currentVolunteers) || 0;
                        transaction.update(eventRef, {
                            currentVolunteers: Math.max(current - 1, 0)
                        });
                    }
                });

                localStorage.removeItem('volunteer_events');
                localStorage.removeItem('volunteer_events_v2');
                localStorage.removeItem(`volunteer_event_${eventId}`);

                // Фоновая синхронизация статуса в Google Таблицу
                syncCancellation(registrationId, new Date().toISOString());

                render(`<h1 class="ok">✓ Запись отменена</h1><p>Спасибо, что предупредили! Место освободилось для других.</p>${backHome()}`);
            } catch (err) {
                console.error(err);
                render(`<h1 class="err">Не удалось отменить</h1><p>Попробуйте ещё раз позже или свяжитесь с организаторами.</p>${backHome()}`);
            }
        }

        init();
    </script>
</body>
</html>
